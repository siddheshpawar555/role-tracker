name: Track new roles

on:
  schedule:
    # Twice a day: ~7:40 am and ~5:40 pm US Central (cron is UTC; shifts 1 h with daylight saving)
    - cron: "40 13,23 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated company ids to check (blank = all)"
        required: false
        default: ""
      rebaseline:
        description: "Treat roles found this run as already-open (not new)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check careers sites
        env:
          ONLY: ${{ github.event.inputs.only }}
          REBASELINE: ${{ github.event.inputs.rebaseline }}
        run: |
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$REBASELINE" = "true" ]; then ARGS="$ARGS --rebaseline"; fi
          python -m tracker run $ARGS

      - name: Save role history
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Role check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
