name: Diagnose failing companies

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated company ids (blank = every failing company)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -m tracker diagnose --only "$ONLY"; else python -m tracker diagnose; fi
      - name: Save report
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add data/diagnose.json
          git diff --cached --quiet || git commit -m "Diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
