name: Diagnose and verify

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated company ids (blank = every failing company)"
        required: false
        default: ""
      mode:
        description: "diagnose = inspect failing sites; verify = fact-check stored roles"
        type: choice
        options: [diagnose, verify]
        default: diagnose

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose or verify
        env:
          ONLY: ${{ github.event.inputs.only }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "verify" ]; then python -m tracker verify | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$ONLY" ]; then python -m tracker diagnose --only "$ONLY"
          else python -m tracker diagnose; fi
      - name: Save report
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add data/diagnose.json data/verify.json data/verify.md 2>/dev/null || true
          git add data/
          git diff --cached --quiet || git commit -m "Diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
